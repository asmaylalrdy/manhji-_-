<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منهجي - معلمك الذكي</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      color: var(--primary);
      font-size: 28px;
    }

    .header p {
      margin-top: 6px;
      color: #64748b;
      font-size: 14px;
    }

    .credits-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    select, input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #fff;
    }

    select:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .bankak-btn {
      background-color: #16a34a;
      margin-top: 10px;
    }

    .bankak-btn:hover {
      background-color: #15803d;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>منهجي 📚</h1>
    <p>معلمك الذكي لكل المواد والمراحل الدراسية</p>
    <div class="credits-badge">الرصيد المجاني اليومي: <span id="creditsCount">5</span>/5 أسئلة</div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label for="stage">المرحلة الدراسية:</label>
      <select id="stage" onchange="updateGrades()">
        <option value="ابتدائي">الابتدائية</option>
        <option value="متوسط">المتوسطة / الإعدادية</option>
        <option value="ثانوي">الثانوية</option>
      </select>
    </div>

    <div class="form-group">
      <label for="grade">الصف الدراسي:</label>
      <select id="grade">
        <!-- يتم تحديثه ديناميكياً -->
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label for="subject">المادة:</label>
      <select id="subject">
        <option value="الرياضيات">الرياضيات</option>
        <option value="العلوم">العلوم / الأحياء</option>
        <option value="الفيزياء">الفيزياء</option>
        <option value="الكيمياء">الكيمياء</option>
        <option value="اللغة العربية">اللغة العربية</option>
        <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
        <option value="الدراسات الإسلامية">الدراسات الإسلامية</option>
        <option value="التاريخ والجغرافيا">التاريخ والجغرافيا</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mode">أسلوب الشرح:</label>
      <select id="mode">
        <option value="both">نصي وصوتي</option>
        <option value="text">نصي فقط</option>
        <option value="audio">صوتي فقط</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="imageInput">صورة الصفحة/المسألة (اختياري):</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="form-group">
    <label for="prompt">السؤال أو الدرس المطلوب شرحه:</label>
    <textarea id="prompt" rows="4" placeholder="اكتب سؤالك هنا أو اطلب شرح درس معين من المنهج..."></textarea>
  </div>

  <button onclick="sendQuery()">ابدأ الشرح الآن 🚀</button>
  <button class="bankak-btn" onclick="openPaymentModal()">شحن رصيد / اشتراك عبر بنكك 💳</button>
</div>

<script>
  const gradesMap = {
    'ابتدائي': ['الصف الأول', 'الصف الثاني', 'الصف الثالث', 'الصف الرابع', 'الصف الخامس', 'الصف السادس'],
    'متوسط': ['الصف الأول المتوسط', 'الصف الثاني المتوسط', 'الصف الثالث المتوسط'],
    'ثانوي': ['الصف الأول الثانوي', 'الصف الثاني الثانوي', 'الصف الثالث الثانوي']
  };

  function updateGrades() {
    const stage = document.getElementById('stage').value;
    const gradeSelect = document.getElementById('grade');
    gradeSelect.innerHTML = '';
    
    gradesMap[stage].forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      gradeSelect.appendChild(opt);
    });
  }

  // التحديث المبدئي للملف عند الفتح
  updateGrades();

  function sendQuery() {
    const text = document.getElementById('prompt').value;
    if (!text.trim()) {
      alert('الرجاء كتابة السؤال أو الدرس المطلوب شرحه أولاً.');
      return;
    }
    
    alert('سيتم إرسال طلبك للمعلم الذكي...');
    // سينقل البيانات لاحقاً إلى Vercel Backend
  }

  function openPaymentModal() {
    alert('سيتم فتح نافذة الاشتراك والتسديد عبر بنكك.');
  }
</script>

</body>
</html>
