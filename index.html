<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منهجي - معلمك الذكي</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { margin: 0; color: var(--primary); font-size: 28px; }
    .header p { margin-top: 6px; color: #64748b; font-size: 14px; }

    .credits-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }

    select, input[type="text"], textarea, input[type="file"] {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 10px; box-sizing: border-box; font-size: 14px; background-color: #fff;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    button {
      width: 100%; padding: 14px; background-color: var(--primary);
      color: white; border: none; border-radius: 10px; font-size: 16px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }
    .bankak-btn { background-color: #16a34a; margin-top: 10px; }
    .bankak-btn:hover { background-color: #15803d; }

    /* صندوق عرض النتيجة */
    #responseContainer {
      margin-top: 24px; padding: 16px; border-radius: 12px;
      background: #f1f5f9; border: 1px solid var(--border); display: none;
      white-space: pre-line; line-height: 1.6;
    }
    .loading { text-align: center; color: var(--primary); font-weight: bold; display: none; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>منهجي 📚</h1>
    <p>معلمك الذكي لكل المواد والمراحل الدراسية</p>
    <div class="credits-badge">الرصيد المجاني اليومي: <span id="creditsCount">5</span>/5 أسئلة</div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label for="stage">المرحلة الدراسية:</label>
      <select id="stage" onchange="updateGrades()">
        <option value="ابتدائي">الابتدائية</option>
        <option value="متوسط">المتوسطة / الإعدادية</option>
        <option value="ثانوي">الثانوية</option>
      </select>
    </div>

    <div class="form-group">
      <label for="grade">الصف الدراسي:</label>
      <select id="grade"></select>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label for="subject">المادة:</label>
      <select id="subject">
        <option value="الرياضيات">الرياضيات</option>
        <option value="العلوم">العلوم / الأحياء</option>
        <option value="الفيزياء">الفيزياء</option>
        <option value="الكيمياء">الكيمياء</option>
        <option value="اللغة العربية">اللغة العربية</option>
        <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
        <option value="الدراسات الإسلامية">الدراسات الإسلامية</option>
        <option value="التاريخ والجغرافيا">التاريخ والجغرافيا</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mode">أسلوب الشرح:</label>
      <select id="mode">
        <option value="text">نصي فقط</option>
        <option value="audio">صوتي فقط</option>
        <option value="both">نصي وصوتي</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="imageInput">صورة الصفحة/المسألة (اختياري):</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="form-group">
    <label for="prompt">السؤال أو الدرس المطلوب شرحه:</label>
    <textarea id="prompt" rows="4" placeholder="اكتب سؤالك هنا أو اطلب شرح درس معين من المنهج..."></textarea>
  </div>

  <button id="submitBtn" onclick="sendQuery()">ابدأ الشرح الآن 🚀</button>
  <button class="bankak-btn" onclick="openPaymentModal()">شحن رصيد / اشتراك عبر بنكك 💳</button>

  <div id="loading" class="loading">جاري تحضير الشرح من المعلم الذكي... ⏳</div>
  <div id="responseContainer"></div>
</div>

<script>
  const gradesMap = {
    'ابتدائي': ['الصف الأول', 'الصف الثاني', 'الصف الثالث', 'الصف الرابع', 'الصف الخامس', 'الصف السادس'],
    'متوسط': ['الصف الأول المتوسط', 'الصف الثاني المتوسط', 'الصف الثالث المتوسط'],
    'ثانوي': ['الصف الأول الثانوي', 'الصف الثاني الثانوي', 'الصف الثالث الثانوي']
  };

  function updateGrades() {
    const stage = document.getElementById('stage').value;
    const gradeSelect = document.getElementById('grade');
    gradeSelect.innerHTML = '';
    
    gradesMap[stage].forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      gradeSelect.appendChild(opt);
    });
  }

  updateGrades();

  // تحويل الصورة إلى Base64
  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  async function sendQuery() {
    const promptText = document.getElementById('prompt').value;
    const imageFile = document.getElementById('imageInput').files[0];
    const loading = document.getElementById('loading');
    const responseBox = document.getElementById('responseContainer');

    if (!promptText.trim() && !imageFile) {
      alert('الرجاء كتابة سؤال أو رفع صورة للدرس.');
      return;
    }

    loading.style.display = 'block';
    responseBox.style.display = 'none';

    let imageBase64 = null;
    let mimeType = null;

    if (imageFile) {
      imageBase64 = await toBase64(imageFile);
      mimeType = imageFile.type;
    }

    const payload = {
      stage: document.getElementById('stage').value,
      grade: document.getElementById('grade').value,
      subject: document.getElementById('subject').value,
      prompt: promptText,
      imageBase64: imageBase64,
      mimeType: mimeType
    };

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      loading.style.display = 'none';

      if (data.result) {
        responseBox.innerHTML = `<h3>💡 الشرح:</h3>` + data.result;
        responseBox.style.display = 'block';
        
        // القراءة الصوتية إذا اختار خيار الصوتي
        const mode = document.getElementById('mode').value;
        if (mode === 'audio' || mode === 'both') {
          speakText(data.result);
        }
      } else {
        alert(data.error || 'حدث خطأ، حاول مرة أخرى.');
      }
    } catch (err) {
      loading.style.display = 'none';
      alert('تعذر الاتصال بالسيرفر. تأكد من إضافة GEMINI_API_KEY في Vercel.');
    }
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      window.speechSynthesis.speak(utterance);
    }
  }

  function openPaymentModal() {
    alert('طريقة الاشتراك عبر بنكك:\n1. قم بتحويل مبلغ الاشتراك لحساب بنكك.\n2. أرسل إيصال التحويل عبر الواتساب لتفعيل حسابك فوراً.');
  }
</script>

</body>
</html>
